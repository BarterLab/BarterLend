[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.29"
verbosity = 3
evm_version = "osaka"
gas_limit = "18446744073709551615"
optimizer = true
optimizer_runs = 200

[profile.test]
optimizer = false
optimizer_runs = 200

[lint]
ignore = ["test/**/*.sol", "script/**/*.sol"]
exclude_lints = [
    "screaming-snake-case-immutable",
    "mixed-case-variable",
    "mixed-case-function",
    "incorrect-shift",
    "pascal-case-struct",
]
